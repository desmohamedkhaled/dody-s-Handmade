<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - dody_s Handmade</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/features.css">
</head>
<body>
    <!-- Header -->
    <header></header>

    <div class="shop-container">
        <section class="shop-header" style="text-align: center; margin-bottom: var(--spacing-2xl); padding: var(--spacing-2xl) var(--spacing-md);">
            <h1 class="shop-title" style="font-size: var(--font-size-3xl); font-weight: 700; color: var(--brand-dark); margin-bottom: var(--spacing-md);">Our Shop</h1>
            <p style="color: var(--color-gray-dark); font-size: var(--font-size-base); margin-top: var(--spacing-md);">Handmade products with care and creativity</p>
        </section>

        <!-- Search & Filter Section -->
        <div class="search-container">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search products by name, code, or description..."
                    aria-label="Search products"
                >
            </div>
        </div>

        <!-- Filters Toolbar -->
        <div class="filters-toolbar">
            <div class="filters-left">
                <!-- Category Dropdown -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-dropdown-toggle" onclick="toggleFilterDropdown('categoryDropdown')">
                        📂 Category <span class="dropdown-arrow">▼</span>
                    </button>
                    <div id="categoryDropdown" class="filter-dropdown-menu" style="display: none;">
                        <div id="categoryFilters" style="padding: var(--spacing-md);"></div>
                    </div>
                </div>

                <!-- Price Dropdown -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-dropdown-toggle" onclick="toggleFilterDropdown('priceDropdown')">
                        💰 Price <span class="dropdown-arrow">▼</span>
                    </button>
                    <div id="priceDropdown" class="filter-dropdown-menu" style="display: none; min-width: 250px;">
                        <div style="padding: var(--spacing-md);">
                            <div style="margin-bottom: var(--spacing-md);">
                                <label style="display: block; font-size: var(--font-size-xs); color: var(--color-gray-medium); margin-bottom: var(--spacing-sm);">Minimum Price</label>
                                <input type="range" id="priceMin" min="0" max="5000" value="0" style="width: 100%;">
                            </div>
                            <div style="margin-bottom: var(--spacing-md);">
                                <label style="display: block; font-size: var(--font-size-xs); color: var(--color-gray-medium); margin-bottom: var(--spacing-sm);">Maximum Price</label>
                                <input type="range" id="priceMax" min="0" max="5000" value="5000" style="width: 100%;">
                            </div>
                            <div style="background: rgba(168, 213, 186, 0.1); padding: var(--spacing-sm); border-radius: var(--radius-sm); text-align: center;">
                                <span id="priceDisplay" style="font-weight: 600; color: var(--brand-primary);">EGP 0 - EGP 5000</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Rating Dropdown -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-dropdown-toggle" onclick="toggleFilterDropdown('ratingDropdown')">
                        ⭐ Rating <span class="dropdown-arrow">▼</span>
                    </button>
                    <div id="ratingDropdown" class="filter-dropdown-menu" style="display: none;">
                        <div style="padding: var(--spacing-md);">
                            <label class="filter-checkbox">
                                <input type="radio" name="rating" value="0" checked> All Ratings
                            </label>
                            <label class="filter-checkbox">
                                <input type="radio" name="rating" value="4"> ★★★★★ 4+
                            </label>
                            <label class="filter-checkbox">
                                <input type="radio" name="rating" value="3"> ★★★★☆ 3+
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Sort Dropdown -->
                <div class="filter-dropdown-wrapper">
                    <button class="filter-dropdown-toggle" onclick="toggleFilterDropdown('sortDropdown')">
                        🔄 Sort <span class="dropdown-arrow">▼</span>
                    </button>
                    <div id="sortDropdown" class="filter-dropdown-menu" style="display: none;">
                        <select id="sortSelect" class="sort-select-dropdown">
                            <option value="name">Product Name (A-Z)</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Highest Rated</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="filters-right">
                <button id="resetFiltersBtn" class="filter-action-btn reset">🔄 Reset</button>
                <button id="viewWishlistBtn" class="filter-action-btn wishlist">
                    ♥ Wishlist <span id="wishlistCount" class="badge">0</span>
                </button>
            </div>
        </div>

        <main>
            <section id="product-list" class="shop-grid"></section>
            <div id="noResults" class="no-results" style="display: none;">
                <div class="no-results-icon">🔍</div>
                <p class="no-results-text">No products found matching your filters.</p>
                <button class="reset-filters-btn">Try different filters</button>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer></footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components/products.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/search.js"></script>
    <script src="js/components/reviews.js"></script>
    <script src="js/components/wishlist.js"></script>
    <script>
        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.filter-dropdown-wrapper')) {
                document.querySelectorAll('.filter-dropdown-menu').forEach(menu => {
                    menu.style.display = 'none';
                });
            }
        });

        // Toggle filter dropdowns
        function toggleFilterDropdown(id) {
            const menu = document.getElementById(id);
            const isOpen = menu.style.display !== 'none';
            
            // Close all other dropdowns
            document.querySelectorAll('.filter-dropdown-menu').forEach(m => {
                m.style.display = 'none';
            });
            
            // Toggle current
            menu.style.display = isOpen ? 'none' : 'block';
        }

        // Initialize search and filter functionality
        let searchFilter = new SearchFilter(PRODUCTS);

        // Initialize event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchFilter.setSearchTerm(e.target.value);
            renderFilteredProducts();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            searchFilter.setSortBy(e.target.value);
            renderFilteredProducts();
        });

        document.getElementById('priceMin').addEventListener('input', updatePriceDisplay);
        document.getElementById('priceMax').addEventListener('input', updatePriceDisplay);

        document.querySelectorAll('input[name="rating"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                searchFilter.setMinRating(parseFloat(e.target.value));
                renderFilteredProducts();
            });
        });

        document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
        document.getElementById('viewWishlistBtn').addEventListener('click', viewWishlist);

        // Setup category filters
        function setupCategoryFilters() {
            const categories = searchFilter.getCategories();
            const container = document.getElementById('categoryFilters');
            
            container.innerHTML = `
                <label class="filter-checkbox">
                    <input type="radio" name="category" value="all" checked> All Categories
                </label>
            ` + categories.map(cat => `
                <label class="filter-checkbox">
                    <input type="radio" name="category" value="${cat}"> ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                </label>
            `).join('');

            document.querySelectorAll('input[name="category"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    searchFilter.setCategory(e.target.value);
                    renderFilteredProducts();
                });
            });
        }

        function updatePriceDisplay() {
            const minInput = document.getElementById('priceMin');
            const maxInput = document.getElementById('priceMax');
            const min = parseFloat(minInput.value);
            const max = parseFloat(maxInput.value);

            if (min > max) {
                minInput.value = max;
            }
            if (max < min) {
                maxInput.value = min;
            }

            const newMin = parseFloat(minInput.value);
            const newMax = parseFloat(maxInput.value);
            document.getElementById('priceDisplay').textContent = `EGP ${newMin} - EGP ${newMax}`;
            
            searchFilter.setPriceRange(newMin, newMax);
            renderFilteredProducts();
        }

        function renderFilteredProducts() {
            const filtered = searchFilter.getFiltered();
            const list = document.getElementById('product-list');
            const noResults = document.getElementById('noResults');

            if (filtered.length === 0) {
                list.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            list.innerHTML = filtered.map(product => {
                const rating = product.averageRating || 0;
                const reviewCount = product.reviewCount || 0;
                const inWishlist = wishlistManager.isInWishlist(product.id);
                
                return `
                    <div class="card" style="border-radius: 20px; overflow: hidden; position: relative;">
                        <img src="${product.image}" alt="${product.name}" class="card-image" />
                        <button class="wishlist-btn ${inWishlist ? 'in-wishlist' : ''}" 
                                onclick="toggleWishlist(${product.id})" 
                                style="position: absolute; top: 10px; right: 10px; z-index: 10;">
                            ${inWishlist ? '♥' : '♡'}
                        </button>
                        <div class="card-content">
                            <h2 class="card-title">${product.name}</h2>
                            <div class="card-code">${product.code}</div>
                            <div class="rating-container">
                                <div>${reviewsManager.generateStarRating(rating, 'sm')}</div>
                                <span class="rating-text">${rating}</span>
                                <span class="review-count">(${reviewCount})</span>
                            </div>
                            <p class="card-description">${product.description}</p>
                            <div class="card-footer">
                                <span class="card-price">EGP ${product.price}</span>
                                <div class="card-actions">
                                    <button class="btn btn-primary buy-now" data-name="${product.name}" data-code="${product.code}">Buy Now</button>
                                    <button class="btn btn-secondary add-to-cart" data-name="${product.name}" data-code="${product.code}">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add event listeners to buttons
            document.querySelectorAll('.buy-now').forEach(btn => {
                btn.addEventListener('click', handleBuyNow);
            });
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', handleAddToCart);
            });
        }

        function handleBuyNow(e) {
            const name = e.target.getAttribute('data-name');
            const code = e.target.getAttribute('data-code');
            const message = encodeURIComponent(`Hello, I want to order: ${name} – Code: ${code}`);
            window.open(`https://wa.me/201010675436?text=${message}`, '_blank');
        }

        function handleAddToCart(e) {
            const name = e.target.getAttribute('data-name');
            const code = e.target.getAttribute('data-code');
            const product = PRODUCTS.find(p => p.name === name && p.code === code);
            
            if (product) {
                const button = e.target;
                const originalText = button.textContent;
                button.textContent = '✓ Added!';
                button.style.background = 'var(--brand-primary)';
                
                setTimeout(() => {
                    button.textContent = 'Add to Cart';
                    button.style.background = '';
                }, 1500);
            }
        }

        function toggleWishlist(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (product) {
                if (wishlistManager.isInWishlist(productId)) {
                    wishlistManager.removeFromWishlist(productId);
                } else {
                    wishlistManager.addToWishlist(product);
                }
                updateWishlistDisplay();
                renderFilteredProducts();
            }
        }

        function updateWishlistDisplay() {
            const count = wishlistManager.getWishlistCount();
            document.getElementById('wishlistCount').textContent = count;
        }

        function viewWishlist() {
            window.location.href = 'wishlist.html';
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.querySelector('input[name="category"][value="all"]').checked = true;
            document.getElementById('priceMin').value = 0;
            document.getElementById('priceMax').value = 5000;
            document.querySelector('input[name="rating"][value="0"]').checked = true;
            document.getElementById('sortSelect').value = 'name';
            
            searchFilter.resetFilters();
            updatePriceDisplay();
            renderFilteredProducts();
            
            // Close all dropdowns
            document.querySelectorAll('.filter-dropdown-menu').forEach(menu => {
                menu.style.display = 'none';
            });
        }

        // Initialize
        setupCategoryFilters();
        updateWishlistDisplay();
        renderFilteredProducts();
    </script>
</body>
</html>
