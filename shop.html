    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">

            <p style="color: var(--color-gray-dark); font-size: var(--font-size-base); margin-top: var(--spacing-md);">Handmade products with care and creativity</p>
        </section>

        <main>
            <section id="product-list" class="shop-grid"></section>
        </main>
    </div>

    <!-- Footer -->
    <footer></footer>

    <script src="js/components/products.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script>

            {

            {

            },
            {
                id: 5,

                price: "EGP 28.00",

            {

            {
                id: 8,

                name: "Wall Clock",

                image: "assets/images/Wall Clock.jpg",

            {
                id: 9,
                code: "NB009",
                name: "Notebook",
                price: "EGP 10.00",

            {

                description: "Special resin decor for Ramadan."
            },
            {
                id: 11,
                code: "CD011",
                name: "Concrete Handmade Décor",
                price: "EGP 25.00",
                image: "assets/images/Concrete Handmade Décor.jpg",
                description: "Modern concrete handmade décor piece."
            },
            {
                id: 12,
                code: "CC012",
                name: "Concrete Candle Shape",
                price: "EGP 14.00",
                image: "assets/images/Concrete Candle Shape.jpg",
                description: "Concrete candle holder in unique shapes."
            },
            {
                id: 13,
                code: "RC013",
                name: "Resin Candle",
                price: "EGP 16.00",
                image: "assets/images/Resin Candle.jpg",
                description: "Hand-poured resin candle with fragrance."
            }
        ];

        // Render products to the shop page with modern design
        function renderProducts(products) {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(product => `
                <div class="card" style="border-radius: 20px; overflow: hidden;">
                    <img src="${product.image}" alt="${product.name}" class="card-image" />
                    <div class="card-content">
                        <h2 class="card-title">${product.name}</h2>
                        <div class="card-code">${product.code}</div>
                        <p class="card-description">${product.description}</p>
                        <div class="card-footer">
                            <span class="card-price">${product.price}</span>
                            <div class="card-actions">
                                <button class="btn btn-primary buy-now" data-name="${product.name}" data-code="${product.code}">Buy Now</button>
                                <button class="btn btn-secondary add-to-cart" data-name="${product.name}" data-code="${product.code}">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Add hover effects
            Array.from(document.querySelectorAll('.card')).forEach(card => {
                card.addEventListener('mouseenter', () => {
                    card.style.boxShadow = 'var(--shadow-lg)';
                    card.style.transform = 'translateY(-4px)';
                });
                card.addEventListener('mouseleave', () => {
                    card.style.boxShadow = 'var(--shadow-md)';
                    card.style.transform = 'translateY(0)';
                });
            });
        }

        // WhatsApp redirect for Buy Now button only
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('buy-now')) {
                const name = e.target.getAttribute('data-name');
                const code = e.target.getAttribute('data-code');
                const message = encodeURIComponent(`Hello, I want to order: ${name} – Code: ${code}`);
                window.open(`https://wa.me/201010675436?text=${message}`, '_blank');
            }
            if (e.target.classList.contains('add-to-cart')) {
                const name = e.target.getAttribute('data-name');
                const code = e.target.getAttribute('data-code');
                addToCart({ name, code });
                e.preventDefault();
            }
        });

        // Cart logic with localStorage
        let cart = JSON.parse(localStorage.getItem('dodyCart')) || [];
        
        function saveCart() {
            localStorage.setItem('dodyCart', JSON.stringify(cart));
        }
        
        function addToCart(product) {
            cart.push(product);
            saveCart();
            
            // Update header cart count
            if (window.Header) {
                const header = new Header();
                header.updateCartCount();
            } else {
                const badge = document.getElementById('cartBadge');
                if (badge) badge.textContent = cart.length;
            }
            
            // Show success message and stay on page
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '✓ Added!';
            button.style.background = 'var(--brand-primary)';
            
            setTimeout(() => {
                button.textContent = 'Add to Cart';
                button.style.background = '';
            }, 1500);
        }
        
        // Update cart count function
        function updateCartCount() {
            const cartCount = document.querySelector('[data-cart-count]');
            if (cartCount) {
                cartCount.textContent = cart.length;
            }
        }

        renderProducts(mockProducts);
        updateCartCount();
    </script>
</body>
</html>
