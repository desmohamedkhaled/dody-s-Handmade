<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Dody's Handcraft</title>
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <!-- Header -->
  <header></header>
  
  <!-- Main Content -->
  <main>
    <div class="shop-container">
      <!-- Header -->
      <div class="shop-header">
        <h1 class="shop-title">Shop Our Collection</h1>
        <p style="color: var(--color-gray-dark); margin-bottom: var(--spacing-lg);">Discover our handcrafted products carefully curated for you</p>
      </div>
      
      <!-- Products Count -->
      <p class="products-count">Showing <span id="productCount">0</span> products</p>
      
      <!-- Products Grid -->
      <div class="shop-grid" id="shopProducts"></div>
      
      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state-icon">📭</div>
        <h3 class="empty-state-title">No Products Found</h3>
        <p class="empty-state-text">Try adjusting your filters or search criteria</p>
      </div>
    </div>
  </main>
  
  <!-- Footer -->
  <footer></footer>
  
  <!-- JavaScript Files -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/products.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  
  <script>
    // Initialize cart
    const cart = new CartManager();
    
    document.addEventListener('DOMContentLoaded', () => {
      // Display all products
      displayProducts(PRODUCTS);
      
      function displayProducts(products) {
        const container = document.getElementById('shopProducts');
        const countElement = document.getElementById('productCount');
        const emptyState = document.getElementById('emptyState');
        
        if (products.length === 0) {
          container.style.display = 'none';
          emptyState.style.display = 'block';
          countElement.textContent = '0';
        } else {
          container.style.display = 'grid';
          emptyState.style.display = 'none';
          ProductCard.renderGrid(products, '#shopProducts');
          countElement.textContent = products.length;
        }
      }
    });
  </script>
</body>
</html>
