<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Dody's Handcraft</title>
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <!-- Header -->
  <header></header>
  
  <!-- Main Content -->
  <main>
    <div class="cart-container">
      <div class="cart-header">
        <h1 class="cart-title">Your Shopping Cart</h1>
      </div>
      
      <!-- Cart Content -->
      <div id="cartContent" class="cart-content">
        <!-- Cart Items will be rendered here -->
      </div>
      
      <!-- Empty Cart State -->
      <div id="emptyCart" class="empty-cart" style="display: none;">
        <div class="empty-cart-icon">🛒</div>
        <h2 class="empty-cart-title">Your cart is empty</h2>
        <p class="empty-cart-text">Start shopping to add items to your cart</p>
        <a href="shop.html" class="btn btn-primary empty-cart-button">Continue Shopping</a>
      </div>
    </div>
  </main>
  
  <!-- Footer -->
  <footer></footer>
  
  <!-- JavaScript Files -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/products.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  
  <script>
    // Load cart from localStorage
    let cartItems = JSON.parse(localStorage.getItem('dodyCart')) || [];
    
    function saveCart() {
      localStorage.setItem('dodyCart', JSON.stringify(cartItems));
    }
    
    function renderCart() {
      const cartContent = document.getElementById('cartContent');
      const emptyCart = document.getElementById('emptyCart');
      
      if (cartItems.length === 0) {
        cartContent.style.display = 'none';
        emptyCart.style.display = 'block';
        return;
      }
      
      cartContent.style.display = 'block';
      emptyCart.style.display = 'none';
      
      const itemsHtml = cartItems.map((item, index) => `
        <div class="cart-item" style="display: flex; gap: var(--spacing-lg); padding: var(--spacing-lg); border: 1px solid var(--color-gray-medium); border-radius: 12px; margin-bottom: var(--spacing-lg);">
          <img src="assets/images/${item.name}.jpg" alt="${item.name}" class="cart-item-image" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
          <div class="cart-item-details" style="flex: 1;">
            <h3 style="font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-sm);">${item.name}</h3>
            <p style="color: var(--color-gray-dark); margin-bottom: var(--spacing-sm);">Code: <strong>${item.code}</strong></p>
            <p style="color: var(--brand-primary); font-weight: 600; font-size: var(--font-size-lg);">${item.price}</p>
            <button class="btn btn-secondary" style="margin-top: var(--spacing-md); padding: var(--spacing-sm) var(--spacing-md); font-size: var(--font-size-sm);" onclick="removeFromCart(${index})">Remove from Cart</button>
          </div>
        </div>
      `).join('');
      
      const total = cartItems.length;
      const summaryHtml = `
        <div style="background: var(--color-gray-light); padding: var(--spacing-lg); border-radius: 12px; margin-top: var(--spacing-2xl);">
          <h3 style="font-size: var(--font-size-lg); font-weight: 700; margin-bottom: var(--spacing-lg);">Order Summary</h3>
          <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-md);">
            <span>Total Items</span>
            <span style="font-weight: 600;">${total}</span>
          </div>
          <div style="border-top: 1px solid var(--color-gray-medium); padding-top: var(--spacing-lg); margin-top: var(--spacing-lg);">
            <button class="btn btn-primary" style="width: 100%; padding: var(--spacing-md) var(--spacing-lg); margin-bottom: var(--spacing-md); font-size: var(--font-size-base);" onclick="checkoutToWhatsApp()">Checkout via WhatsApp</button>
            <a href="shop.html" class="btn btn-secondary" style="width: 100%; padding: var(--spacing-md) var(--spacing-lg); display: block; text-align: center; text-decoration: none;">Continue Shopping</a>
          </div>
        </div>
      `;
      
      cartContent.innerHTML = itemsHtml + summaryHtml;
    }
    
    function removeFromCart(index) {
      cartItems.splice(index, 1);
      saveCart();
      renderCart();
      
      // Update header cart count
      if (window.Header) {
        const header = new Header();
        header.updateCartCount();
      }
    }
    
    function checkoutToWhatsApp() {
      if (cartItems.length === 0) {
        alert('Your cart is empty!');
        return;
      }
      
      const items = cartItems.map(p => `${p.name} – Code: ${p.code}`).join('\n');
      const message = encodeURIComponent(`Hello, I want to order:\n${items}`);
      window.open(`https://wa.me/201010675436?text=${message}`, '_blank');
      
      // Clear cart after checkout
      cartItems = [];
      localStorage.removeItem('dodyCart');
      renderCart();
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });
  </script>
</body>
</html>
