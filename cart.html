<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Dody's Handcraft</title>
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <!-- Header -->
  <header></header>
  
  <!-- Main Content -->
  <main>
    <div class="cart-container">
      <div class="cart-header">
        <h1 class="cart-title">Your Shopping Cart</h1>
      </div>
      
      <!-- Cart Content -->
      <div id="cartContent" class="cart-content">
        <!-- Cart Items will be rendered here -->
      </div>
      
      <!-- Empty Cart State -->
      <div id="emptyCart" class="empty-cart" style="display: none;">
        <div class="empty-cart-icon">🛒</div>
        <h2 class="empty-cart-title">Your cart is empty</h2>
        <p class="empty-cart-text">Start shopping to add items to your cart</p>
        <a href="shop.html" class="btn btn-primary empty-cart-button">Continue Shopping</a>
      </div>
    </div>
  </main>
  
  <!-- Footer -->
  <footer></footer>
  
  <!-- JavaScript Files -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/products.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
      
      window.updateQuantity = function(productId, quantity) {
        const qty = parseInt(quantity);
        if (qty < 1) {
          cart.removeFromCart(productId);
        } else {
          cart.updateQuantity(productId, qty);
        }
        renderCart();
      };
      
      window.removeItem = function(productId) {
        cart.removeFromCart(productId);
        renderCart();
        new Header().updateCartCount();
        showNotification('Item removed from cart', 'success');
      };
      
      function renderCart() {
        const cartItems = cart.getCart();
        const cartContent = document.getElementById('cartContent');
        const emptyCart = document.getElementById('emptyCart');
        
        if (cartItems.length === 0) {
          cartContent.style.display = 'none';
          emptyCart.style.display = 'block';
          return;
        }
        
        cartContent.style.display = 'grid';
        emptyCart.style.display = 'none';
        
        const itemsHtml = cartItems.map(item => `
          <div class="cart-items">
            <div class="cart-item">
              <img src="${item.image}" alt="${item.name}" class="cart-item-image" onerror="this.src='https://via.placeholder.com/100?text=${encodeURIComponent(item.name)}'">
              <div class="cart-item-details">
                <h3 class="cart-item-name">${item.name}</h3>
                <p class="cart-item-code">Code: ${item.code}</p>
                <p class="cart-item-price">${formatCurrency(item.price)} each</p>
                <div class="cart-item-controls">
                  <input type="number" min="1" value="${item.quantity}" class="quantity-input" onchange="updateQuantity(${item.id}, this.value)">
                  <button class="remove-button" onclick="removeItem(${item.id})">Remove</button>
                </div>
              </div>
            </div>
        `).join('');
        
        const total = cart.getTotal();
        const summaryHtml = `
          <div class="cart-summary">
            <h3 class="summary-title">Order Summary</h3>
            <div class="summary-row">
              <span>Subtotal</span>
              <span>${formatCurrency(total)}</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>Calculated at checkout</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span class="summary-total-value">${formatCurrency(total)}</span>
            </div>
            <div class="summary-buttons">
              <a href="checkout.html" class="btn btn-primary">Proceed to Checkout</a>
              <a href="shop.html" class="btn btn-secondary">Continue Shopping</a>
            </div>
          </div>
          </div>
        `;
        
        cartContent.innerHTML = itemsHtml + summaryHtml;
      }
    });
  </script>
</body>
</html>
